[project]
name = "crypto-signal-bot"
version = "1.0.0"
description = "Telegram bot for SPOT market analysis and signal generation"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.4.1",
    "aiohttp==3.9.1",
    "numpy==1.26.0",
    "pydantic==2.5.3",
    "python-dotenv==1.0.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis*", "bot*", "config*", "core*", "database*", "exchange*", "services*"]
exclude = ["logs*", "tests*", "data*"]
namespaces = true

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
