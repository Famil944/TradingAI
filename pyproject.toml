[project]
name = "tradingai-otc-research"
version = "2.0.0"
description = "Read-only Pocket Option OTC research signals and reproducible journal"
requires-python = ">=3.12"
dependencies = ["aiogram==3.31.0", "aiohttp==3.14.5", "python-dotenv==1.2.4", "otcharts==0.7.0", "tzdata==2026.6"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "preflight"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*", "config*", "core*", "database*", "services*"]
exclude = ["tests*", "data*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
