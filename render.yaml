services:
  - type: worker
    name: tradingai-otc-research
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install .
    startCommand: python main.py
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 30
    disk:
      name: trading-ai-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: TRADING_AI_DB_PATH
        value: /var/data/trading_ai.db
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OTCHARTS_API_KEY
        sync: false
      - key: OTC_ADMIN_CHAT_ID
        sync: false
