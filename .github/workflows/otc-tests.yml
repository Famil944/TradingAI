name: OTC tests
on:
  push:
    branches-ignore: [reports]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q main.py bot config core database services
      - run: sh -n scripts/start_render.sh
      - run: python -m pip wheel . --no-deps -w dist
      - run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              for name in ("web/__init__.py", "web/mini_app.py", "web/index.html", "web/app.js"):
                  assert name in names, f"wheel missing {name}"
          PY

  ml-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,ml]'
      - run: python -m unittest tests.test_otc_ml -v
